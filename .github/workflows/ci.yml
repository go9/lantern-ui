name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must match the toolchain the repo is actually developed on. The HEEx
      # formatter changed between 1.18 and 1.19, so a repo formatted with 1.19
      # fails `mix format --check-formatted` under 1.18 — on files the PR never
      # touched. CI only runs on pull_request, so this went unnoticed on main.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "28"
          elixir-version: "1.19"

      # The cache key MUST include the OTP/Elixir version. deps and _build hold
      # version-compiled artifacts — including the Phoenix.LiveView.HTMLFormatter
      # plugin that `mix format` loads — so a cache compiled under an old
      # toolchain formats HEEx differently than the new binary expects, failing
      # `--check-formatted` on files no PR touched. Keying only on mix.lock (which
      # is unchanged by a toolchain bump) served exactly that stale cache.
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-mix-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors

      # Hooks are authored in assets/js/ and bundled into priv/static/. Mix
      # tests read the committed bundle, so build + dirty-check before mix test.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed hooks bundle matches source
        run: git diff --exit-code -- priv/static/lantern_ui_hooks.js
      - run: node --check priv/static/lantern_ui_hooks.js

      - run: mix test
      - run: mix lantern.lint
      - run: mix lantern.llms --check
      - run: npm test
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Control sizing and chart browser gates
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          BASE: http://127.0.0.1:4013
          QA_REPORT_DIR: /tmp/lantern-ui-consistency
          QA_SHOTS: /tmp/lantern-ui-chart-qa
        run: |
          PORT=4013 mix run --no-halt test/qa/server.exs > /tmp/lantern-ui-qa-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE/consistency" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE/consistency" >/dev/null
          node test/qa/run.mjs --consistency --consistency-legacy
          node test/qa/run.mjs --charts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            /tmp/lantern-ui-consistency
            /tmp/lantern-ui-chart-qa
